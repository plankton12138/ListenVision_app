name: Flutter checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与提交的锁文件来源一致，避免 --enforce-lockfile 因仓库来源不同而改写锁文件。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend_flutter
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Check generated sources
        run: git diff --exit-code -- '*.g.dart' '*.freezed.dart'
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android-artifacts:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Version tag must match pubspec.yaml version $VERSION"
            exit 1
          fi
      - run: flutter build apk --release --split-per-abi --no-pub
      - run: sha256sum build/app/outputs/flutter-apk/app-*-release.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: listenvision-${{ steps.version.outputs.version }}-verification-${{ github.run_number }}
          path: |
            frontend_flutter/build/app/outputs/flutter-apk/app-*-release.apk
            frontend_flutter/build/app/outputs/flutter-apk/SHA256SUMS
